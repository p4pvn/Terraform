image: hashicorp/terraform:1.5.7

stages:
  - init

variables:
  TF_IN_AUTOMATION: "1"
  TF_WORKING_DIR: "${TF_WORKING_DIR:-.}"

terraform:init:
  stage: init
  script:
    - echo "=> cd $TF_WORKING_DIR"
    - cd "$TF_WORKING_DIR"
    - |
      # Build backend args from TF_BACKEND_CONFIGS (semicolon-separated)
      BACKEND_ARGS=""
      if [ -n "$TF_BACKEND_CONFIGS" ]; then
        IFS=';' read -ra _BCFG <<< "$TF_BACKEND_CONFIGS"
        for cfg in "${_BCFG[@]}"; do
          BACKEND_ARGS="$BACKEND_ARGS -backend-config=$cfg"
        done
      fi
      echo "Backend args: $BACKEND_ARGS"
    - echo "Running terraform init..."
    - eval "terraform init $BACKEND_ARGS ${TF_CLI_ARGS:-} -input=false"
  cache:
    key: "$CI_PROJECT_ID-tf-cache"
    paths:
      - .terraform
  artifacts:
    expire_in: 1h
    paths:
      - .terraform
